# Configuração Nginx — proxy reverso para o dashboard SSA
# Coloque em: /etc/nginx/sites-available/ssa-monitor
# Ative com:  sudo ln -s /etc/nginx/sites-available/ssa-monitor /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx
#
# ORDEM DE INSTALAÇÃO (importante):
#   1. Comente o bloco :443 abaixo (ainda não existe certificado).
#   2. Suba só o bloco :80 SEM o "return 301" (deixe o location / com proxy_pass)
#      e rode o certbot para emitir o certificado.
#   3. Depois de emitido o certificado, troque o bloco :80 para redirecionar
#      (como já está abaixo) e descomente o bloco :443.
#
# ACESSO RESTRITO: este sistema é de uso exclusivo do escritório. As linhas
# "allow" abaixo devem conter APENAS o(s) IP(s) público(s) do escritório.
# Descubra o IP público de dentro da rede do escritório com: curl ifconfig.me

server {
    listen 80;
    listen [::]:80;
    server_name seu-dominio.com.br;   # ← troque pelo seu domínio

    # Todo tráfego HTTP é redirecionado para HTTPS — nunca serve a aplicação
    # em texto puro (Basic Auth/login e dados de processos não podem
    # trafegar sem criptografia).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name seu-dominio.com.br;   # ← troque pelo seu domínio

    ssl_certificate     /etc/letsencrypt/live/seu-dominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    # ── Headers de segurança ──────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        # ── Restrição por IP — só o(s) IP(s) do escritório ────────────
        # Adicione uma linha "allow" por IP/faixa autorizada.
        allow 203.0.113.10;   # ← IP público do escritório (SUBSTITUA)
        # allow 203.0.113.0/24;  # exemplo de faixa, se necessário
        deny all;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
