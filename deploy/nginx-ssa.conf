# Configuração Nginx — proxy reverso para o dashboard SSA
# Coloque em: /etc/nginx/sites-available/ssa-monitor
# Ative com:  sudo ln -s /etc/nginx/sites-available/ssa-monitor /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name seu-dominio.com.br;   # ← troque pelo seu domínio

    # Redireciona HTTP → HTTPS (descomente após configurar SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

